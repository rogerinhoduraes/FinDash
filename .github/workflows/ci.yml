name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'functions/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build (web)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `npm ci` fails if package.json and package-lock.json are out of sync,
      # guarding lockfile discipline in addition to a reproducible install.
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  functions:
    name: Functions (syntax)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install function dependencies
        working-directory: functions
        run: npm ci

      - name: Syntax check
        working-directory: functions
        run: node --check index.js
