name: FinDash ETL

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'etl/**'

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias
        run: pip install -r etl/requirements.txt

      - name: Rodar ETL
        env:
          MCP_INSTALL_ID:       ${{ secrets.MCP_INSTALL_ID }}
          MCP_API_KEY:          ${{ secrets.MCP_API_KEY }}
          PLUGGY_ITEM_IDS:      ${{ secrets.PLUGGY_ITEM_IDS }}
          FIREBASE_WEBHOOK_URL: ${{ secrets.FIREBASE_WEBHOOK_URL }}
          FIREBASE_ETL_SECRET:  ${{ secrets.FIREBASE_ETL_SECRET }}
          FIREBASE_USER_UID:    ${{ secrets.FIREBASE_USER_UID }}
          DAYS_BACK: '456'
          MAX_TX: '5000'
        run: python etl/etl_pluggy.py
